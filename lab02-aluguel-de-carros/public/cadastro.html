<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AluguelCar — sistema web de gestão de aluguéis de automóveis (Lab 02 · DIW · PUC Minas).">
  <meta name="theme-color" content="#0b5c85">
  <title>Cadastro · AluguelCar</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <noscript><div class="alert alert-danger m-3">Este sistema precisa de JavaScript habilitado.</div></noscript>
  <div id="navbar"></div>
  <main class="container py-4">
    <div class="row justify-content-center"><div class="col-lg-8">
      <div class="card"><div class="card-body p-4">
        <h1 class="h3 mb-1" id="titulo">Cadastro</h1>
        <p class="text-muted" id="subtitulo"></p>
        <div id="alerta"></div>

        <ul class="nav nav-pills mb-4" id="seletor-perfil" role="tablist">
          <li class="nav-item"><button class="nav-link active" type="button" data-perfil="cliente"><i class="bi bi-person me-1"></i>Sou cliente</button></li>
          <li class="nav-item"><button class="nav-link" type="button" data-perfil="agente"><i class="bi bi-bank me-1"></i>Sou agente (empresa/banco)</button></li>
        </ul>

        <form id="form-cliente" novalidate>
          <h2 class="h6 text-uppercase text-muted">Identificação</h2>
          <div class="row g-3 mb-4">
            <div class="col-12"><label class="form-label required" for="c-nome">Nome completo</label>
              <input class="form-control" id="c-nome" maxlength="120" required><div class="invalid-feedback"></div></div>
            <div class="col-md-6"><label class="form-label required" for="c-rg">RG</label>
              <input class="form-control" id="c-rg" maxlength="20" required><div class="invalid-feedback"></div></div>
            <div class="col-md-6"><label class="form-label required" for="c-cpf">CPF</label>
              <input class="form-control" id="c-cpf" inputmode="numeric" placeholder="000.000.000-00" required><div class="invalid-feedback"></div></div>
            <div class="col-12"><label class="form-label required" for="c-endereco">Endereço</label>
              <input class="form-control" id="c-endereco" maxlength="200" placeholder="Rua, número, bairro, cidade/UF" required><div class="invalid-feedback"></div></div>
            <div class="col-12"><label class="form-label required" for="c-profissao">Profissão</label>
              <input class="form-control" id="c-profissao" maxlength="80" required><div class="invalid-feedback"></div></div>
          </div>

          <div class="d-flex justify-content-between align-items-center">
            <h2 class="h6 text-uppercase text-muted mb-0">Rendimentos (entidade empregadora e valor mensal)</h2>
            <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-add-rendimento"><i class="bi bi-plus-lg me-1"></i>Adicionar</button>
          </div>
          <p class="small text-muted mb-2">Informe de 1 a 3 rendimentos. Eles são usados na análise financeira do pedido.</p>
          <div id="rendimentos" class="mb-2"></div>
          <div class="text-danger small mb-3" id="rendimentos-erro"></div>

          <h2 class="h6 text-uppercase text-muted">Acesso</h2>
          <div class="row g-3 mb-4">
            <div class="col-md-6"><label class="form-label required" for="c-email">E-mail</label>
              <input type="email" class="form-control" id="c-email" autocomplete="username" required><div class="invalid-feedback"></div></div>
            <div class="col-md-6"><label class="form-label" id="c-senha-label" for="c-senha">Senha</label>
              <input type="password" class="form-control" id="c-senha" autocomplete="new-password" minlength="6"><div class="invalid-feedback"></div></div>
          </div>
          <div class="d-flex gap-2 justify-content-end">
            <a class="btn btn-outline-secondary" href="index.html" id="cancelar-cliente">Cancelar</a>
            <button class="btn btn-brand" type="submit"><i class="bi bi-check2-circle me-1"></i><span id="rotulo-salvar-cliente">Cadastrar</span></button>
          </div>
        </form>

        <form id="form-agente" class="d-none" novalidate>
          <div class="row g-3 mb-4">
            <div class="col-md-8"><label class="form-label required" for="a-nome">Razão social / nome</label>
              <input class="form-control" id="a-nome" maxlength="120" required><div class="invalid-feedback"></div></div>
            <div class="col-md-4"><label class="form-label required" for="a-tipo">Tipo de agente</label>
              <select class="form-select" id="a-tipo"><option value="empresa">Empresa</option><option value="banco">Banco</option></select></div>
            <div class="col-md-6"><label class="form-label required" for="a-cnpj">CNPJ</label>
              <input class="form-control" id="a-cnpj" inputmode="numeric" placeholder="00.000.000/0000-00" required><div class="invalid-feedback"></div></div>
            <div class="col-md-6"><label class="form-label required" for="a-email">E-mail</label>
              <input type="email" class="form-control" id="a-email" autocomplete="username" required><div class="invalid-feedback"></div></div>
            <div class="col-md-6"><label class="form-label" id="a-senha-label" for="a-senha">Senha</label>
              <input type="password" class="form-control" id="a-senha" autocomplete="new-password" minlength="6"><div class="invalid-feedback"></div></div>
          </div>
          <div class="d-flex gap-2 justify-content-end">
            <a class="btn btn-outline-secondary" href="index.html" id="cancelar-agente">Cancelar</a>
            <button class="btn btn-brand" type="submit"><i class="bi bi-check2-circle me-1"></i><span id="rotulo-salvar-agente">Cadastrar</span></button>
          </div>
        </form>
      </div></div>
    </div></div>
  </main>

  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="config.js"></script>
  <script type="module" src="js/pages/cadastro.js"></script>
</body>
</html>
