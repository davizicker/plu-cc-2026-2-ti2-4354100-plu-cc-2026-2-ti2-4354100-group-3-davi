<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Automóveis · AluguelCar</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>
  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
      <div><h1 class="h3 mb-0">Automóveis</h1><p class="text-muted mb-0" id="subtitulo"></p></div>
      <button class="btn btn-brand" id="btn-novo"><i class="bi bi-plus-lg me-1"></i>Novo automóvel</button>
    </div>
    <div id="alerta"></div>
    <div class="card mb-3"><div class="card-body py-2">
      <input type="search" id="busca" class="form-control" placeholder="Buscar por placa, marca, modelo ou matrícula…" aria-label="Buscar automóveis">
    </div></div>
    <div class="card"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
      <thead class="table-light"><tr><th>Placa</th><th>Veículo</th><th>Ano</th><th>Matrícula</th><th class="text-end">Diária</th><th>Proprietário</th><th class="text-center">Reservas ativas</th><th class="text-end">Ações</th></tr></thead>
      <tbody id="lista"></tbody></table></div></div>
  </main>

  <div class="modal fade" id="modal-auto" tabindex="-1" aria-labelledby="modal-auto-titulo" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><form class="modal-content" id="form-auto" novalidate>
      <div class="modal-header"><h5 class="modal-title" id="modal-auto-titulo">Novo automóvel</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div>
      <div class="modal-body">
        <div id="modal-alerta"></div>
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label required" for="f-marca">Marca</label><input class="form-control" id="f-marca" maxlength="40" required><div class="invalid-feedback"></div></div>
          <div class="col-md-6"><label class="form-label required" for="f-modelo">Modelo</label><input class="form-control" id="f-modelo" maxlength="60" required><div class="invalid-feedback"></div></div>
          <div class="col-md-4"><label class="form-label required" for="f-ano">Ano</label><input class="form-control" id="f-ano" type="number" required><div class="invalid-feedback"></div></div>
          <div class="col-md-4"><label class="form-label required" for="f-placa">Placa</label><input class="form-control" id="f-placa" maxlength="8" placeholder="ABC1D23" required><div class="invalid-feedback"></div></div>
          <div class="col-md-4"><label class="form-label required" for="f-matricula">Matrícula</label><input class="form-control" id="f-matricula" maxlength="20" required><div class="invalid-feedback"></div></div>
          <div class="col-md-6"><label class="form-label required" for="f-diaria">Valor da diária (R$)</label><input class="form-control" id="f-diaria" type="number" min="1" step="0.01" required><div class="invalid-feedback"></div></div>
          <div class="col-md-6" id="grupo-proprietario"><label class="form-label required" for="f-proprietario">Proprietário</label><select class="form-select" id="f-proprietario"></select></div>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn btn-brand">Salvar</button></div>
    </form></div>
  </div>

  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="config.js"></script>
  <script type="module" src="js/pages/automoveis.js"></script>
</body>
</html>
