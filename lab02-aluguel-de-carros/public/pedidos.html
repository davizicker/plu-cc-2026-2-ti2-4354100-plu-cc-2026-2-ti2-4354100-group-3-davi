<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AluguelCar — sistema web de gestão de aluguéis de automóveis (Lab 02 · DIW · PUC Minas).">
  <meta name="theme-color" content="#0b5c85">
  <title>Pedidos · AluguelCar</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <noscript><div class="alert alert-danger m-3">Este sistema precisa de JavaScript habilitado.</div></noscript>
  <div id="navbar"></div>
  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
      <div><h1 class="h3 mb-0">Pedidos de aluguel</h1><p class="text-muted mb-0" id="subtitulo"></p></div>
      <button class="btn btn-brand d-none" id="btn-novo"><i class="bi bi-plus-lg me-1"></i>Novo pedido</button>
    </div>
    <div id="alerta"></div>
    <div class="card mb-3"><div class="card-body py-2"><div class="row g-2">
      <div class="col-md-4"><select id="filtro-status" class="form-select" aria-label="Filtrar por status">
        <option value="">Todos os status</option><option>Em análise</option><option>Aprovado</option><option>Reprovado</option><option>Contratado</option><option>Cancelado</option></select></div>
      <div class="col-md-8"><input type="search" id="busca" class="form-control" placeholder="Buscar por cliente, placa ou modelo…" aria-label="Buscar pedidos"></div>
    </div></div></div>
    <div class="card"><div class="table-responsive"><table class="table table-hover align-middle mb-0 table-stack">
      <thead class="table-light"><tr id="cabecalho"></tr></thead><tbody id="lista"><tr><td colspan="8" class="text-center text-muted py-4"><span class="spinner-border spinner-border-sm me-2"></span>Carregando…</td></tr></tbody></table></div></div>
  </main>

  <!-- Criar / modificar pedido -->
  <div class="modal fade" id="modal-pedido" tabindex="-1" aria-labelledby="modal-pedido-titulo" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><form class="modal-content" id="form-pedido" novalidate>
      <div class="modal-header"><h5 class="modal-title" id="modal-pedido-titulo">Novo pedido</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div>
      <div class="modal-body">
        <div id="modal-pedido-alerta"></div>
        <div class="mb-3"><label class="form-label required" for="p-auto">Automóvel</label><select class="form-select" id="p-auto" required></select><div class="invalid-feedback"></div></div>
        <div class="row g-3 mb-3">
          <div class="col-6"><label class="form-label required" for="p-inicio">Retirada</label><input type="date" class="form-control" id="p-inicio" required><div class="invalid-feedback"></div></div>
          <div class="col-6"><label class="form-label required" for="p-fim">Devolução</label><input type="date" class="form-control" id="p-fim" required><div class="invalid-feedback"></div></div>
        </div>
        <div class="form-check form-switch mb-2">
          <input class="form-check-input" type="checkbox" id="p-credito" role="switch"><label class="form-check-label" for="p-credito">Solicitar contrato de crédito a um banco</label>
        </div>
        <div class="mb-3 d-none" id="grupo-banco"><label class="form-label required" for="p-banco">Banco</label><select class="form-select" id="p-banco"></select><div class="invalid-feedback"></div></div>
        <div class="mb-3"><label class="form-label" for="p-obs">Observações</label><textarea class="form-control" id="p-obs" rows="2" maxlength="300"></textarea></div>
        <div class="alert alert-light border mb-0 py-2" id="p-resumo">Selecione o automóvel e o período.</div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Voltar</button><button type="submit" class="btn btn-brand" id="btn-salvar-pedido">Salvar</button></div>
    </form></div>
  </div>

  <!-- Detalhes -->
  <div class="modal fade" id="modal-detalhe" tabindex="-1" aria-labelledby="modal-detalhe-titulo" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="modal-detalhe-titulo">Pedido</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div>
      <div class="modal-body" id="detalhe-corpo"></div>
    </div></div>
  </div>

  <!-- Avaliação financeira (agentes) -->
  <div class="modal fade" id="modal-avaliacao" tabindex="-1" aria-labelledby="modal-avaliacao-titulo" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="modal-avaliacao-titulo">Avaliar pedido</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div>
      <div class="modal-body">
        <div id="modal-avaliacao-alerta"></div>
        <div id="avaliacao-corpo"></div>
        <div class="mt-3"><label class="form-label required" for="a-parecer">Parecer financeiro</label>
          <textarea class="form-control" id="a-parecer" rows="3" maxlength="400" placeholder="Justifique a decisão (mín. 5 caracteres)"></textarea><div class="invalid-feedback"></div></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary me-auto" data-bs-dismiss="modal">Voltar</button>
        <button type="button" class="btn btn-danger" id="btn-reprovar"><i class="bi bi-x-circle me-1"></i>Parecer negativo</button>
        <button type="button" class="btn btn-success" id="btn-aprovar"><i class="bi bi-check-circle me-1"></i>Parecer positivo</button>
      </div>
    </div></div>
  </div>

  <!-- Execução do contrato (agentes) -->
  <div class="modal fade" id="modal-contrato" tabindex="-1" aria-labelledby="modal-contrato-titulo" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><form class="modal-content" id="form-contrato" novalidate>
      <div class="modal-header"><h5 class="modal-title" id="modal-contrato-titulo">Executar contrato</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div>
      <div class="modal-body">
        <div id="modal-contrato-alerta"></div>
        <div id="contrato-resumo" class="mb-3"></div>
        <div class="mb-3"><label class="form-label required" for="k-propriedade">Propriedade do automóvel após o contrato</label><select class="form-select" id="k-propriedade"></select></div>
        <div id="grupo-credito" class="d-none">
          <h6 class="text-uppercase text-muted">Contrato de crédito</h6>
          <div class="row g-3">
            <div class="col-12"><label class="form-label required" for="k-valor">Valor financiado (R$)</label><input type="number" class="form-control" id="k-valor" min="1" step="0.01"><div class="invalid-feedback"></div></div>
            <div class="col-6"><label class="form-label required" for="k-parcelas">Parcelas</label><input type="number" class="form-control" id="k-parcelas" min="1" max="60" value="6"><div class="invalid-feedback"></div></div>
            <div class="col-6"><label class="form-label required" for="k-taxa">Taxa mensal (%)</label><input type="number" class="form-control" id="k-taxa" min="0" max="20" step="0.01" value="1.9"><div class="invalid-feedback"></div></div>
          </div>
          <div class="alert alert-light border mt-3 mb-0 py-2" id="k-parcela-previa"></div>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Voltar</button><button type="submit" class="btn btn-brand" id="btn-executar">Executar contrato</button></div>
    </form></div>
  </div>

  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="config.js"></script>
  <script type="module" src="js/pages/pedidos.js"></script>
</body>
</html>
